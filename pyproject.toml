[project]
name = "whisper-diarize"
version = "0.2.0"
description = "Transcribe audio and video with Whisper and label each line with its speaker using pyannote."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leonard Michalas" }]
keywords = ["speech-to-text", "transcription", "diarization", "whisper", "pyannote"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "openai-whisper>=20240930",
    "pyannote.audio>=3.1,<4",
    "torch>=2.2",
]

[project.scripts]
transcribe = "transcribe:main"

[project.urls]
Homepage = "https://github.com/LeonardMichalas/whisper-diarize"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["transcribe.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["whisper", "whisper.*", "pyannote.*", "torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
