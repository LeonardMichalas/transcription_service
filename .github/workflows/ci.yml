name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # The tests cover everything except the models themselves, so the
      # multi-gigabyte model dependencies are not installed here.
      - name: Install dev tools
        run: uv sync --only-group dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run --only-group dev ruff check --output-format=github .

      - name: Format check
        run: uv run --only-group dev ruff format --check .

      - name: Type check
        run: uv run --only-group dev mypy transcribe.py tests

      - name: Tests
        run: uv run --only-group dev pytest
